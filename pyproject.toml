[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "2.1.0"
description = "A smolagents data-analysis agent with a Streamlit UI, SQL, cloud data connectors and MCP (client and server)."
readme = "README.md"
requires-python = ">=3.11"  # pandas 3 needs 3.11+
license = { text = "MIT" }
authors = [{ name = "Kabilan Mani" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=4.8"]
bigquery = ["google-cloud-bigquery[pandas]>=3.30", "db-dtypes"]

[tool.setuptools]
py-modules = ["agent", "mcp_tools", "mcp_server", "streamlit_app"]
packages = ["tools", "ui", "evals"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# put the project root on sys.path so tests import `tools`/`agent` without hacks
pythonpath = ["."]
